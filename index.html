<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>To Do App</title>

    <!-- Conectar CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>To Do App</h1>

    </div>

    <!-- Conectar JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
